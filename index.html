<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minong_FormActivity</title>
</head>
<body>
    <!DOCTYPE html>
    <html lang="en">
    <head>
        
    <h1>HTML Form</h1>
    
    <form action="#" method="post">
            
        <fieldset>
            <legend>Personal Information</legend>
                
            <p>
            <label for="fullname">Full Name:</label><br>
            <input type="text" id="fullname" name="fullname" required>
            </p>
                
            <p>
            <label for="email">Email Address:</label><br>
             <input type="email" id="email" name="email" required>
            </p>
            </fieldset>
    
            <fieldset>
            <legend>Gender</legend>
                
            <p>
            <input type="radio" id="gender-male" name="gender" value="male">
            <label for="gender-male">Male</label><br>
                    
            <input type="radio" id="gender-female" name="gender" value="female">
            <label for="gender-female">Female</label><br>
                    
            <input type="radio" id="gender-other" name="gender" value="other">
            <label for="gender-other">Other</label>
             </p>
            </fieldset>
    
            <fieldset>
                <legend>Hobbies</legend>
                
            <p>
            <input type="checkbox" id="hobby-reading" name="hobbies" value="Gaming">
            <label for="hobby-Gaming">Gaming</label><br>
                    
            <input type="checkbox" id="hobby-traveling" name="hobbies" value="traveling">
            <label for="hobby-traveling">Traveling</label><br>
                    
            <input type="checkbox" id="hobby-sports" name="hobbies" value="Sleeping">
            <label for="hobby-Sleeping">Sleeping</label>
            
            <input type="checkbox" id="hobby-sports" name="hobbies" value="Cleaning">
            <label for="hobby-Cleaning">Cleaning</label>

            </p>
            </fieldset>
    
            <p>
            <label for="comments">Additional Comments:</label><br>
            <textarea id="comments" name="comments" rows="5" cols="40"></textarea>
            </p>
    
            <p>
                <input type="submit" value="Submit">
            </p>
            
        </form>
    
</body>
</html>
